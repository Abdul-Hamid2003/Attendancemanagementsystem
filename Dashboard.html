<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance System</title>
    <link rel="stylesheet" href="Style.css">
    
</head>

<body class="Dashboard-body">
     <button class="add-btn2" onclick="logout()">Logout--</button>
     <div class="top-actions" id="top-Actions">
    <button class="delete-btn"
        onclick="showDeleteList('student')">
        Student Delete
    </button>

    <button class="delete-btn"
        onclick="showDeleteList('teacher')">
        Teacher Delete
    </button><br>
    </div>
<div class="container">
    <h2>Add Student</h2>

    <input type="text" id="roll" placeholder="Roll No"><br>
    <input type="text" id="name" placeholder="Student Name"><br>
    <input type="text" id="course" placeholder="Course Name"><br>

    <button class="add-btn" onclick="addStudent()">Add Student</button> 
</div> 
<div id="deleteListBox" style="display:none;">

    <h3>Select User To Delete</h3>

    <ul id="deleteList"></ul>

</div>
<h2 style="color:black">Student List (Daily Attendance)</h2>
<h3 style="color:brown">Select Attendance Date</h3>
<input type="date" id="attendanceDate" class="half-input">
<table>
    <thead>
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Course</th>
            <th>Action</th>
            <th>Status (Today)</th>
        </tr>
    </thead>
    <tbody id="table"></tbody>
</table>
<h3 style="color:floralwhite"><u>Search by Date</u></h3>
<input type="date" id="searchDate" class="half-input">
<button class="add-btn" onclick="searchByDate()">Search</button>

<h3 style="color:floralwhite"><u>Monthly Report</u></h3>
<input type="month" id="searchMonth" class="half-input">
<button class="add-btn" onclick="monthlyReport()">Show Report</button>

<table>
    <thead>
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Course</th>
            <th>Total Present</th>
            <th>Total Absent</th>
        </tr>
    </thead>
    <tbody id="monthlyTable"></tbody>
</table>
<script src="Dashboard.js"></script>
</body>
</html>
